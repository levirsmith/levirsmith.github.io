<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-suffix="gallery">gallery</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-depth="1" data-page="gallery">
  <span class="corner corner--tl"></span>
  <span class="corner corner--tr"></span>
  <span class="corner corner--bl"></span>
  <span class="corner corner--br"></span>

  <main class="gallery-page">
    <a href="../" class="home-link"><span aria-hidden="true">&#8592;</span> <span data-field="homeLabel">home</span></a>

    <header class="gallery-header">
      <h1 class="g-title" data-field="galleryTitle">gallery</h1>
      <p class="g-note" data-field="galleryNote">a collection of frames</p>
    </header>

    <div id="gallery"></div>

    <nav class="site-nav" id="site-nav" hidden></nav>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="photo viewer">
    <p class="lightbox-counter" id="lightbox-counter" aria-live="polite"></p>
    <button class="lightbox-close" id="lightbox-close">close</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="previous photo">&#8592;</button>
    <figure class="lightbox-stage">
      <img id="lightbox-img" alt="">
      <span class="copyright" id="lightbox-copyright" aria-hidden="true"></span>
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="next photo">&#8594;</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="../assets/js/fonts.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
